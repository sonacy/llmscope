name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.x'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build UI
        run: bun run --filter '@llmscope/ui' build

      - name: Compute SHA256 of addon.py
        id: hash
        run: |
          sha=$(shasum -a 256 packages/llmscope-mitmproxy/addon.py | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          shasum -a 256 packages/llmscope-mitmproxy/addon.py > addon.py.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/llmscope-mitmproxy/addon.py
            addon.py.sha256
          body: |
            llmscope ${{ github.ref_name }}

            **Single-file mitmproxy addon SHA256:** `${{ steps.hash.outputs.sha }}`

            See [docs/quickstart.md](https://github.com/sonacy/llmscope/blob/main/docs/quickstart.md).

  # npm publish is intentionally manual for v1; uncomment + add NPM_TOKEN once
  # @llmscope/cli is ready for first publication.
